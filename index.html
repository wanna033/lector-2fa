<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector 2FA</title>
<style>
  :root{--bg:#f3f5f4;--card:#ffffff;--text:#16201d;--muted:#5d6b66;--accent:#0f766e;--on-accent:#ffffff;--border:#dbe3e0;--bad:#b91c1c;--ok:#15803d;--shadow:0 10px 30px rgba(0,0,0,.18)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#162120;--text:#e6efec;--muted:#93a5a0;--accent:#4fd1c0;--on-accent:#06201c;--border:#27403c;--bad:#f87171;--ok:#4ade80;--shadow:0 10px 30px rgba(0,0,0,.6);color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#0e1514;--card:#162120;--text:#e6efec;--muted:#93a5a0;--accent:#4fd1c0;--on-accent:#06201c;--border:#27403c;--bad:#f87171;--ok:#4ade80;--shadow:0 10px 30px rgba(0,0,0,.6);color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;padding:16px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:1.4rem;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
  input[type=text]{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font:inherit}
  button,.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;display:inline-block}
  button.sec,.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--text);font-size:.9rem}
  #msg{font-size:.9rem;margin-top:8px;min-height:1.2em}
  .err{color:var(--bad)}.ok{color:var(--ok)}
  video{width:100%;border-radius:8px;margin-top:10px;display:none}
  .acc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
  .acc:first-child{border-top:0}
  .info{flex:1;min-width:150px}
  .name{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code{font:600 1.9rem ui-monospace,Consolas,monospace;letter-spacing:.08em;cursor:pointer;font-variant-numeric:tabular-nums}
  .ring{width:38px;height:38px;flex:none;color:var(--text)}
  .ibtn{background:none;color:var(--muted);border:1px solid var(--border);padding:6px 9px;font-size:.8rem}
  .ibtn:hover{color:var(--accent);border-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:12px}
  .hint{color:var(--muted);font-size:.8rem}

  /* Modo ventana propia (popup): solo una cuenta */
  body.solo main > :not(#soloview){display:none}
  #soloview{display:none}
  body.solo #soloview{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6vh;text-align:center}
  body.solo #soloview .code{font-size:clamp(2.4rem,14vw,4.5rem)}
  body.solo #soloview .ring{width:72px;height:72px}
</style>
</head>
<body>
<main>
  <h1>Lector 2FA</h1>

  <div class="card">
    <label for="secret">Clave secreta (Base32) o enlace otpauth://</label>
    <input id="secret" type="text" placeholder="JBSWY3DPEHPK3PXP  ó  otpauth://totp/..." autocomplete="off" spellcheck="false">
    <label for="name">Nombre (opcional)</label>
    <input id="name" type="text" placeholder="Gmail, GitHub...">
    <div class="row">
      <button id="add">Añadir</button>
      <label class="btn sec" style="margin:0">Leer imagen QR<input id="file" type="file" accept="image/*" hidden></label>
      <button class="sec" id="cam">Escanear con cámara</button>
    </div>
    <video id="video" playsinline muted></video>
    <label class="chk"><input type="checkbox" id="autowin" checked> Abrir una pestaña nueva con el código cada vez que añada una cuenta</label>
    <div id="msg"></div>
  </div>

  <div class="card" id="pubcard" hidden>
    <label>Cuentas públicas (se actualizan solas)</label>
    <div id="publist"></div>
  </div>

  <div class="card" id="vaultcard" hidden>
    <label for="vaultpass">Cuentas compartidas (cifradas). Escribe la contraseña que te dieron.</label>
    <input id="vaultpass" type="password" placeholder="Contraseña compartida" autocomplete="off" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font:inherit">
    <div class="row"><button id="vaultgo">Cargar cuentas</button></div>
  </div>

  <div class="card">
    <label for="bkpass">Copia de seguridad (cifrada con contraseña)</label>
    <input id="bkpass" type="password" placeholder="Contraseña de la copia" autocomplete="new-password" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font:inherit">
    <div class="row">
      <button class="sec" id="export">Descargar copia</button>
      <button id="share">Crear enlace para compartir</button>
      <button class="sec" id="mkpublic">Crear archivo público (sin cifrar)</button>
      <label class="btn sec" style="margin:0">Restaurar copia<input id="import" type="file" accept=".json,application/json" hidden></label>
    </div>
    <div class="hint" id="store-status" style="margin-top:8px"></div>
  </div>

  <div class="card" id="list"></div>
  <p class="hint">Todo se procesa en tu navegador. Las claves se guardan solo en este equipo. Toca un código para copiarlo. <b>Abrir pestaña</b> muestra el código de esa cuenta en su propia pestaña, que se actualiza sola.</p>

  <div id="soloview">
    <div class="name" id="solo-name"></div>
    <div class="code" id="solo-code" title="Copiar">······</div>
    <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--border)" stroke-width="4"/>
      <circle id="solo-arc" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="94.25" transform="rotate(-90 18 18)"/>
      <text id="solo-sec" x="18" y="22" text-anchor="middle" font-size="11" fill="currentColor"></text></svg>
    <div class="hint">Esta pestaña se actualiza sola. Puedes cerrarla cuando termines.</div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
let accounts = [];
try { accounts = JSON.parse(localStorage.getItem('accounts2fa') || '[]'); } catch {}
/* Guardado doble (localStorage + IndexedDB) y almacenamiento persistente */
const idbOpen = () => new Promise((res, rej) => {
  const r = indexedDB.open('lector2fa', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idbSet = async v => { try { const db = await idbOpen(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, 'accounts'); } catch {} };
const idbGet = async () => { try { const db = await idbOpen(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('accounts'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch { return null; } };
const save = () => { try { localStorage.setItem('accounts2fa', JSON.stringify(accounts)); } catch {} idbSet(JSON.parse(JSON.stringify(accounts))); askPersist(); };
let persistAsked = false;
async function askPersist() {
  if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
  persistAsked = true;
  try { await navigator.storage.persist(); } catch {}
  showStatus();
}
async function showStatus() {
  const el = $('store-status'); if (!el) return;
  let p = false; try { p = await navigator.storage.persisted(); } catch {}
  el.textContent = accounts.length
    ? 'Guardado en este navegador' + (p ? ' (almacenamiento protegido).' : '. Haz una copia de seguridad para no perderlo si el navegador borra los datos.')
    : '';
}

/* Copia de seguridad cifrada (AES-GCM + contraseña) */
const b64 = u => btoa(String.fromCharCode(...u));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function backupKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function shareLink() {
  if (!accounts.length) return msg('No hay cuentas que compartir.', 'err');
  const rnd = crypto.getRandomValues(new Uint8Array(24));
  const key = Array.from(rnd, b => B32[b & 31]).join('');
  await exportBackup(key, 'vault.json', true);
  const link = location.origin + location.pathname + '#k=' + key;
  msg('Paso 1: sube el archivo vault.json descargado al repositorio de GitHub (Add file → Upload files). Paso 2: envía este enlace a tu amigo: ' + link, 'ok');
  try { await navigator.clipboard.writeText(link); } catch {}
}
async function exportBackup(passArg, fileName, silent) {
  const pass = typeof passArg === 'string' ? passArg : $('bkpass').value;
  if (pass.length < 6) return msg('Escribe una contraseña de al menos 6 caracteres para cifrar la copia.', 'err');
  if (!accounts.length) return msg('No hay cuentas que guardar.', 'err');
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await backupKey(pass, salt), new TextEncoder().encode(JSON.stringify(accounts))));
  const blob = new Blob([JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName || 'copia-2fa.json'; a.click();
  if (!silent) msg('Copia descargada. Guárdala en un lugar seguro y recuerda la contraseña.', 'ok');
}
async function importBackup(file, passOverride) {
  const pass = passOverride || $('bkpass').value;
  if (!pass) return msg('Escribe la contraseña de la copia y vuelve a elegir el archivo.', 'err');
  try {
    const j = JSON.parse(typeof file === 'string' ? file : await file.text());
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(j.iv) }, await backupKey(pass, unb64(j.salt)), unb64(j.data));
    const list = JSON.parse(new TextDecoder().decode(pt));
    let n = 0;
    for (const a of list) if (!accounts.some(x => x.secret === a.secret)) { a.id = a.id || id(); accounts.push(a); n++; }
    save(); render(); msg(n + ' cuenta(s) restaurada(s).', 'ok');
  } catch { msg('No se pudo abrir la copia: contraseña incorrecta o archivo dañado.', 'err'); }
}
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let dirty = false;
accounts.forEach(a => { if (!a.id) { a.id = id(); dirty = true; } });
if (dirty) save();
const getAuto = () => { try { return localStorage.getItem('autowin2fa') !== '0'; } catch { return true; } };
$('autowin').checked = getAuto();
$('autowin').onchange = e => { try { localStorage.setItem('autowin2fa', e.target.checked ? '1' : '0'); } catch {} };

function b32decode(s) {
  s = s.toUpperCase().replace(/[\s=-]/g, '');
  let bits = '';
  for (const c of s) {
    const i = B32.indexOf(c);
    if (i < 0) throw new Error('Clave Base32 inválida');
    bits += i.toString(2).padStart(5, '0');
  }
  const out = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < out.length; i++) out[i] = parseInt(bits.substr(i * 8, 8), 2);
  if (!out.length) throw new Error('Clave vacía');
  return out;
}

// Respaldo SHA-1/HMAC en JS puro para contextos sin crypto.subtle
function sha1(m) {
  const l = m.length, w = new Uint32Array(((l + 8 >> 6) + 1) * 16), r = new Uint32Array(80);
  for (let i = 0; i < l; i++) w[i >> 2] |= m[i] << (24 - (i & 3) * 8);
  w[l >> 2] |= 0x80 << (24 - (l & 3) * 8);
  w[w.length - 1] = l * 8;
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const rol = (x, n) => (x << n) | (x >>> (32 - n));
  for (let j = 0; j < w.length; j += 16) {
    for (let i = 0; i < 16; i++) r[i] = w[j + i];
    for (let i = 16; i < 80; i++) r[i] = rol(r[i - 3] ^ r[i - 8] ^ r[i - 14] ^ r[i - 16], 1);
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      const [f, k] = i < 20 ? [(b & c) | (~b & d), 0x5A827999] : i < 40 ? [b ^ c ^ d, 0x6ED9EBA1]
        : i < 60 ? [(b & c) | (b & d) | (c & d), 0x8F1BBCDC] : [b ^ c ^ d, 0xCA62C1D6];
      const t = (rol(a, 5) + f + e + k + r[i]) | 0;
      e = d; d = c; c = rol(b, 30); b = a; a = t;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
  }
  const out = new Uint8Array(20);
  [h0, h1, h2, h3, h4].forEach((v, i) => { for (let k = 0; k < 4; k++) out[i * 4 + k] = (v >>> (24 - k * 8)) & 255; });
  return out;
}
function hmacSha1(key, msg) {
  if (key.length > 64) key = sha1(key);
  const ip = new Uint8Array(64 + msg.length), op = new Uint8Array(84);
  for (let i = 0; i < 64; i++) { const k = key[i] || 0; ip[i] = k ^ 0x36; op[i] = k ^ 0x5c; }
  ip.set(msg, 64); op.set(sha1(ip), 64);
  return sha1(op);
}

async function hmac(algorithm, keyBytes, buf) {
  if (crypto.subtle) {
    const algo = { SHA1: 'SHA-1', SHA256: 'SHA-256', SHA512: 'SHA-512' }[algorithm] || 'SHA-1';
    const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: algo }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', key, buf));
  }
  if (algorithm !== 'SHA1') throw new Error('Este algoritmo requiere abrir la página por https o file://');
  return hmacSha1(keyBytes, new Uint8Array(buf));
}

async function totp(acc, time = Date.now()) {
  const counter = Math.floor(time / 1000 / acc.period);
  const buf = new ArrayBuffer(8);
  const dv = new DataView(buf);
  dv.setUint32(0, Math.floor(counter / 2 ** 32));
  dv.setUint32(4, counter >>> 0);
  const h = await hmac(acc.algorithm, b32decode(acc.secret), buf);
  const o = h[h.length - 1] & 15;
  const n = ((h[o] & 0x7f) << 24 | h[o + 1] << 16 | h[o + 2] << 8 | h[o + 3]) % 10 ** acc.digits;
  return String(n).padStart(acc.digits, '0');
}



function parseInput(text, nameField) {
  text = text.trim();
  if (/^otpauth:\/\//i.test(text)) {
    const u = new URL(text);
    if (u.hostname !== 'totp') throw new Error('Solo se admite TOTP (basado en tiempo)');
    const p = u.searchParams;
    const label = decodeURIComponent(u.pathname.slice(1));
    const issuer = p.get('issuer');
    return {
      name: nameField || (issuer && !label.startsWith(issuer) ? issuer + ': ' + label : label) || 'Cuenta',
      secret: p.get('secret') || '',
      digits: +p.get('digits') || 6,
      period: +p.get('period') || 30,
      algorithm: (p.get('algorithm') || 'SHA1').toUpperCase()
    };
  }
  return { name: nameField || 'Cuenta', secret: text, digits: 6, period: 30, algorithm: 'SHA1' };
}

function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = cls || ''; }
const fmt = c => c.length === 6 ? c.slice(0, 3) + ' ' + c.slice(3) : c;

async function addAccount(text, nameField) {
  const acc = parseInput(text, nameField);
  b32decode(acc.secret);
  await totp(acc);
  acc.id = id();
  accounts.push(acc); save(); render();
  if ($('autowin').checked) openTab(acc.id, true);
}

function openTab(accId, fromAuto) {
  const w = window.open(location.pathname + '?w=' + encodeURIComponent(accId), '_blank');
  if (!w) msg('El navegador bloqueó la pestaña nueva. Permite ventanas emergentes para esta página y pulsa "Abrir pestaña" en la cuenta.', 'err');
  return w;
}

function copy(el) {
  const t = el.dataset.raw; if (!t) return;
  const o = el.textContent;
  navigator.clipboard.writeText(t).then(() => { el.textContent = 'Copiado'; setTimeout(() => el.textContent = o, 800); }, () => {});
}

/* ---------- Añadir ---------- */
$('add').onclick = async () => {
  try { await addAccount($('secret').value, $('name').value.trim()); $('secret').value = ''; $('name').value = ''; msg('Cuenta añadida', 'ok'); }
  catch (e) { msg(e.message, 'err'); }
};

async function decodeQR(img) {
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector({ formats: ['qr_code'] }).detect(img); if (r.length) return r[0].rawValue; } catch {}
  }
  if (!window.jsQR) return null;
  for (const target of [800, 500, 1200, 300, 0]) {
    const k = target ? Math.min(1, target / Math.max(img.width, img.height)) : 1;
    const w = Math.round(img.width * k), h = Math.round(img.height * k), pad = 40;
    const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, pad, pad, w, h);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    const r = jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    if (r) return r.data;
  }
  return null;
}

$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const text = await decodeQR(await createImageBitmap(f));
    if (!text) throw new Error('No se encontró ningún QR. Recorta la captura para que solo se vea el QR, o pega la clave manual.');
    await addAccount(text, $('name').value.trim());
    msg('QR leído y cuenta añadida', 'ok');
  } catch (err) { msg(err.message, 'err'); }
  e.target.value = '';
};

let stream = null;
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('video').style.display = 'none'; $('cam').textContent = 'Escanear con cámara'; }
$('cam').onclick = async () => {
  if (stream) return stopCam();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('video'); v.srcObject = stream; v.style.display = 'block'; await v.play();
    $('cam').textContent = 'Detener cámara';
    const det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    const tick = async () => {
      if (!stream) return;
      if (v.videoWidth) {
        let text = null;
        try { if (det) { const r = await det.detect(v); if (r.length) text = r[0].rawValue; } } catch {}
        if (!text && window.jsQR) {
          c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
          const d = ctx.getImageData(0, 0, c.width, c.height);
          const r = jsQR(d.data, c.width, c.height); if (r) text = r.data;
        }
        if (text) {
          try { await addAccount(text, $('name').value.trim()); msg('QR escaneado y cuenta añadida', 'ok'); stopCam(); return; }
          catch (e) { msg(e.message, 'err'); }
        }
      }
      setTimeout(tick, 250);
    };
    tick();
  } catch { msg('No se pudo acceder a la cámara. Permite el acceso o usa la clave manual.', 'err'); stopCam(); }
};

/* ---------- Lista ---------- */
function render() {
  const L = $('list');
  if (!accounts.length) { L.innerHTML = '<div class="empty">Aún no hay cuentas. Añade una clave o un QR.</div>'; return; }
  L.innerHTML = '';
  accounts.forEach((a, i) => {
    const d = document.createElement('div'); d.className = 'acc'; d.dataset.id = a.id;
    d.innerHTML = `<div class="info"><div class="name"></div><div class="code" title="Copiar">······</div></div>
      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--border)" stroke-width="4"/>
      <circle class="arc" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="94.25" transform="rotate(-90 18 18)"/>
      <text class="sec" x="18" y="22" text-anchor="middle" font-size="11" fill="currentColor"></text></svg>
      <button class="ibtn p" title="Abrir el código en una pestaña nueva">Abrir pestaña</button>
      <button class="ibtn x" title="Eliminar">✕</button>`;
    d.querySelector('.name').textContent = a.name;
    d.querySelector('.p').onclick = () => openTab(a.id);
    d.querySelector('.x').onclick = () => {
      if (!confirm('¿Eliminar "' + a.name + '"?')) return;
      accounts.splice(i, 1); save(); render();
    };
    d.querySelector('.code').onclick = ev => copy(ev.currentTarget);
    L.appendChild(d);
  });
  update();
}

async function paint(root, a, now) {
  const left = a.period - (now / 1000) % a.period;
  const codeEl = root.querySelector('.code');
  try {
    const c = await totp(a, now);
    if (codeEl.dataset.raw !== c) { codeEl.dataset.raw = c; codeEl.textContent = fmt(c); }
  } catch { codeEl.textContent = 'Error'; }
  root.querySelector('.arc').style.strokeDashoffset = 94.25 * (1 - left / a.period);
  root.querySelector('.sec').textContent = Math.ceil(left);
}

let pub = [];
async function update() {
  const now = Date.now();
  for (const row of document.querySelectorAll('.acc')) {
    const a = accounts.find(x => x.id === row.dataset.id) || pub.find(x => x.id === row.dataset.id); if (a) await paint(row, a, now);
  }
}
function renderPub() {
  const L = $('publist'); L.innerHTML = '';
  pub.forEach(a => {
    const d = document.createElement('div'); d.className = 'acc'; d.dataset.id = a.id;
    d.innerHTML = `<div class="info"><div class="name"></div><div class="code" title="Copiar">······</div></div>
      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--border)" stroke-width="4"/>
      <circle class="arc" cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="94.25" transform="rotate(-90 18 18)"/>
      <text class="sec" x="18" y="22" text-anchor="middle" font-size="11" fill="currentColor"></text></svg>`;
    d.querySelector('.name').textContent = a.name;
    d.querySelector('.code').onclick = ev => copy(ev.currentTarget);
    L.appendChild(d);
  });
  $('pubcard').hidden = !pub.length;
  update();
}
function makePublicFile() {
  if (!accounts.length) return msg('No hay cuentas que publicar.', 'err');
  const blob = new Blob([JSON.stringify(accounts.map(({ id: _i, ...r }, i) => ({ id: 'p' + i, ...r })), null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'public.json'; a.click();
  msg('Descargado public.json. Súbelo al repositorio de GitHub (Add file → Upload files). Cualquiera que abra la página verá esas cuentas y sus claves.', 'ok');
}

/* ---------- Modo ventana propia (?w=ID) ---------- */
const soloId = new URLSearchParams(location.search).get('w');
if (soloId) {
  document.body.classList.add('solo');
  document.title = 'Código 2FA';
  const sc = $('solo-code');
  sc.onclick = () => copy(sc);
  const tick = async () => {
    try { accounts = JSON.parse(localStorage.getItem('accounts2fa') || '[]'); } catch {}
    const a = accounts.find(x => x.id === soloId);
    if (!a) { $('solo-name').textContent = 'Cuenta no encontrada. Ábrela desde la página principal.'; return; }
    $('solo-name').textContent = a.name; document.title = a.name + ' · 2FA';
    const now = Date.now(), left = a.period - (now / 1000) % a.period;
    try { const c = await totp(a, now); if (sc.dataset.raw !== c) { sc.dataset.raw = c; sc.textContent = fmt(c); } } catch { sc.textContent = 'Error'; }
    $('solo-arc').style.strokeDashoffset = 94.25 * (1 - left / a.period);
    $('solo-sec').textContent = Math.ceil(left);
  };
  tick(); setInterval(tick, 250);
} else {
  $('export').onclick = () => exportBackup();
  $('share').onclick = shareLink;
  $('mkpublic').onclick = makePublicFile;
  // Cuentas públicas: public.json junto a la página, visible para todos
  const loadPub = () => fetch('public.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!Array.isArray(j)) return;
    const sig = JSON.stringify(j); if (sig === loadPub.last) return; loadPub.last = sig;
    pub = j.filter(a => a && a.secret).map((a, i) => ({ period: 30, digits: 6, algorithm: 'SHA1', ...a, id: 'p' + i })); renderPub();
  }).catch(() => {});
  loadPub(); setInterval(loadPub, 60000);
  $('import').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
  render();
  setInterval(update, 250);
  // Si localStorage se vació pero IndexedDB conserva copia, restaurar
  if (!accounts.length) idbGet().then(a => {
    if (a && a.length) { accounts = a; save(); render(); msg('Cuentas restauradas automáticamente.', 'ok'); }
  });
  askPersist(); showStatus();
  // Cuentas compartidas: vault.json publicado junto a la página (cifrado)
  fetch('vault.json', { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(t => {
    if (!t) return;
    try { JSON.parse(t); } catch { return; }
    const hk = /^#k=([A-Z2-7]{20,})$/.exec(location.hash);
    if (hk) {
      history.replaceState(null, '', location.pathname);
      importBackup(t, hk[1]);
      return;
    }
    $('vaultcard').hidden = false;
    const go = async () => { const p = $('vaultpass').value; if (!p) return; await importBackup(t, p); if (/restaurada/.test($('msg').textContent)) { $('vaultpass').value = ''; $('vaultcard').hidden = true; } };
    $('vaultgo').onclick = go;
    $('vaultpass').onkeydown = e => { if (e.key === 'Enter') go(); };
  }).catch(() => {});
}
</script>
</body>
</html>
